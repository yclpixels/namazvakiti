name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Syntax check (app.js + worker + tools/)
        run: |
          for f in app.js sw.js worker/index.mjs tools/*.js tools/migrations/*.js; do
            echo "Checking $f"
            node --check "$f"
          done

      - name: Worker location map consistency
        run: |
          node tools/build-worker-data.js
          if [ -n "$(git status --porcelain)" ]; then
            echo "::error::worker/locations.json is out of date. Run 'node tools/build-worker-data.js' locally and commit the result."
            git status --porcelain
            exit 1
          fi

      - name: Route generation consistency
        run: |
          node tools/generate-pages.js
          if [ -n "$(git status --porcelain)" ]; then
            echo "::error::generate-pages.js produced changes — repository is out of sync with tools/data/turkey-il-ilce.json. Run 'node tools/generate-pages.js' locally and commit the result."
            git status --porcelain
            exit 1
          fi
          echo "Route generation is consistent — no missing/stale pages."

      - name: Sitemap consistency
        run: |
          node tools/build-sitemap.js
          if [ -n "$(git status --porcelain)" ]; then
            echo "::error::sitemap.xml is out of date. Run 'node tools/build-sitemap.js' locally and commit the result."
            git status --porcelain
            exit 1
          fi
          echo "sitemap.xml is up to date."

      - name: SEO / data quality gate
        run: |
          node tools/quality-gate.js
          FAIL_COUNT=$(node -e "console.log(require('./tools/data/faz2-quality-gate-results.json').failCount)")
          if [ "$FAIL_COUNT" != "0" ]; then
            echo "::error::Quality gate found $FAIL_COUNT failing district page(s)."
            exit 1
          fi
          echo "Quality gate passed — all district pages valid."

# Not: tools/build-dataset.js bu iş akışına dahil edilmedi — canlı Diyanet API'sine
# 80+ ardışık istek attığı için CI'da her push'ta çalıştırılması hem yavaş hem de
# dış servis kesintisine bağımlı, yanıltıcı CI başarısızlıklarına yol açabilir.
# Bu script periyodik/manuel bakım için ayrı çalıştırılmalıdır.

  indexnow:
    # Değişen sayfaları Bing/Yandex'e bildirir; yalnızca main'e push'ta,
    # doğrulama geçtikten ve Workers Builds yayını bitmiş olacak kadar bekledikten sonra.
    needs: validate
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Notify IndexNow
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          sleep 90
          if git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            FILES=$(git diff --name-only "$BEFORE" HEAD -- '*.html')
          else
            FILES=$(git diff --name-only HEAD~1 HEAD -- '*.html')
          fi
          node tools/indexnow.js $FILES || echo "::warning::IndexNow bildirimi başarısız"
