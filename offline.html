<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Namaz Vakitleri – Çevrimdışı</title>
<meta name="robots" content="noindex"/>
<link rel="icon" href="/favicon.ico"/>
<link rel="icon" type="image/png" sizes="32x32" href="/assets/icons/favicon-32-v2.png"/>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;
    background:#08090a;color:#f7f8f8;font-family:"Inter Variable",-apple-system,system-ui,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased;text-align:center;padding:24px;}
  .logo{font-size:52px}
  h1{font-size:24px;font-weight:590;letter-spacing:-.02em}
  p{color:#8a8f98;font-size:15px;line-height:1.6;max-width:320px}
  button{margin-top:8px;height:36px;padding:0 18px;border-radius:999px;border:none;cursor:pointer;
    background:#e6e6e7;color:#08090a;font-family:inherit;font-size:13.5px;font-weight:550;transition:background .15s;}
  button:hover{background:#fff}
</style>
</head>
<body>
  <div class="logo">🕌</div>
  <h1>Çevrimdışısınız</h1>
  <p>İnternet bağlantısı bulunamadı. Daha önce görüntülediğiniz vakitler önbellekte olabilir.</p>
  <button onclick="location.reload()">Yeniden Dene</button>
  <button onclick="history.back()">Geri Dön</button>
</body>
</html>
